name: "Minecraft Bedrock Dedicated Server"
slug: minecraft_bedrock_server
description: >
  Minecraft Bedrock Dedicated Server for Home Assistant OS.
  Automatically downloads the latest Bedrock server binary and stores
  all data persistently in /share. Does not require Java.
version: "0.0.2"

arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false
host_network: false

# Bedrock requires UDP port 19132
# The host port can be changed in the HA UI
ports:
  19132/udp: 19132
ports_description:
  19132/udp: "Minecraft Bedrock server port (container fixed to 19132 UDP)"

map:
  - share:rw

options:
  data_dir: "/share/minecraft-bedrock"

schema:
  data_dir: str
